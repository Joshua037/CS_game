          <ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">需求描述：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;">目前针对TG钱包用户的提现均为跳转至钱包侧进行金额输入申请，针对不同层级用户的提款限制无法控制</span></p><ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">解决方案：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;"> 钱包侧发起提现申请后基于请求中用户信息包网获取用户层级的提现金额限制</span></p><p><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 根据钱包侧提现申请中提现金额数据进行比对，超出提现金额限制，包网侧返回钱包提现失败和失败理由</span></p><ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">需求范围：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;"> 1. TG钱包</span></p><p><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 2. 包网侧提现接口</span></p>
