        <div id="u858_text" class="text ">
          <ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">需求描述：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;">目前世界杯合集以活动的形式在平台活动列表中，进入详情后点击合集内的banner进行其他详情页的跳转以新页面/页签的形式打开导致新页面无法返回</span></p><ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">解决方案：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;"> 在小程序当前页面中进行跳转，点击返回后可返回活动合集页面</span></p><ul><li style=""><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">需求范围：</span></li></ul><p><span style="font-family:&quot;微软雅黑 Bold&quot;, &quot;微软雅黑&quot;, sans-serif;font-weight:700;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; </span><span style="font-family:&quot;微软雅黑&quot;, sans-serif;font-weight:400;"> 前台→活动→解锁世界杯特权→详情页</span></p>
        </div>
